name: BetterDesk Identity Tests

on:
  push:
    branches:
      - fix/windows-identity-persistence-a1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity-tests:
    name: Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libssl-dev libudev-dev \
            libx11-dev libxi-dev libxtst-dev \
            libxrandr-dev libxinerama-dev \
            libxcursor-dev libxfixes-dev libxext-dev \
            libwayland-dev

      - name: Run complete Rust test suite
        run: cargo test --lib
